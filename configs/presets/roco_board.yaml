# RoCo Challenge(산업용 양팔 조립) 프리셋 — SmolVLAConfig 생성 시 **override로만** 쓴다.
# input_features/output_features/vlm_model_name 등 데이터셋에 따라 달라지는 값은 포함하지
# 않으므로, 실제 사용 시에는 기본 kwargs와 합쳐서 넘겨야 한다:
#
#   import yaml
#   from lerobot.policies.smolvla.configuration_smolvla import SmolVLAConfig
#   overrides = yaml.safe_load(open("configs/presets/roco_board.yaml"))
#   config = SmolVLAConfig(input_features=..., output_features=..., **overrides)
#
# **스키마 확인됨(2026-10-29, 사용자가 공식 데이터셋 meta/info.json을 직접 확인)**:
# action 14차원 순서는
#   left_ee_x, left_ee_y, left_ee_z, left_ee_rx, left_ee_ry, left_ee_rz, left_gripper,
#   right_ee_x, right_ee_y, right_ee_z, right_ee_rx, right_ee_ry, right_ee_rz, right_gripper
# 즉 팔별로 연속된 [엔드이펙터 pose 6(xyz+rxryrz) + 그리퍼 1] = 7채널 블록이 왼팔, 오른팔
# 순서로 이어진다 — 아래 ard_arm_dim=7/ard_gripper_dim=1(마지막 1채널=그리퍼)과 정확히
# 일치한다(이 샌드박스는 여전히 HF Hub에 직접 접근하지 못해서, 이 스키마는 사용자가 전달한
# 값을 그대로 반영한 것이다 — 재확인은 사용자가 했음).
#
# **아직 미확인**: per_timestep_norm_a/_s는 실제 데이터로 피팅하지 못해 항등(identity,
# a=1,s=0)으로 둔다 —
# scripts/fit_timestep_norm.py --dataset-repo-id rocochallenge2025/rocochallenge2026_Industrial_Assembly
# --chunk-size 20 를 돌려서 갱신해야 한다. chunk_size=20/n_action_steps=5가 실제 과제에
# 적절한지, 10fps/시연 200개 외 세부 통계도 미확인.

use_ard: true  # 비대칭 역할 분리(Stabilizer/Actuator) 자체는 RoCo에서도 그대로 유효한 전제

# 공식 데이터는 "대부분 왼팔만 사용"(공개 스펙) — 즉 왼팔이 실제 작업(조립)을 수행하는
# Actuator, 오른팔이 보조/고정 역할인 Stabilizer다. 기존 기본값(ard_default_actuator_arm=
# "right")과 반대라서 role_map으로 명시적으로 뒤집는다.
role_map:
  stabilizer: right
  actuator: left

# 확인된 스키마: 팔당 [ee pose 6 + 그리퍼 1] = 7채널(위 상단 주석 참고). 마지막 1채널이
# 그리퍼라서 ard_gripper_dim=1(기존 의미 그대로 — smooth_loss/traj_loss에서만 제외, L_pos는
# 그대로 받음).
ard_arm_dim: 7
ard_gripper_dim: 1

# 액션이 관절 각도가 아니라 엔드이펙터 목표 pose이므로 "joint"가 아니라 "ee" — 이러면
# configuration_smolvla.py의 __post_init__이 lac_mirror_sign(관절 축 미러링 가정)을 자동으로
# 무효화한다(lac_mode=none이라 당장은 영향 없지만, 나중에 LAC를 켜게 될 경우를 대비).
action_space: ee

# angle_unwrap_dims(rx/ry/rz 채널을 학습 전 시간축으로 펴고 추론 후 다시 [-pi,pi)로 감싸는
# 전처리 옵션, processor_smolvla.py 참고)는 일단 꺼둔다(기본 None) — scripts/
# check_rotation_range.py로 실제 데이터가 ±pi 경계를 넘는지 먼저 확인하고, rx/ry/rz가
# 오일러각인지 회전벡터(axis-angle)인지도 아직 불확실하다(회전벡터면 이 전처리 자체가
# 틀린 접근이다 — docs/configurable_ard.md 참고). 켜려면 angle_unwrap_dims: [3,4,5,10,11,12]
# (왼팔+오른팔 rx,ry,rz, 절대 인덱스)로 명시해야 한다.

# RoCo Challenge 1회 우승팀이 목표 근처에서 기울기가 사라지는 L2 대신 L1로 바꿔 끝까지
# 정밀하게 밀어넣는 효과를 봤다고 보고함(arXiv 2603.15469).
pos_loss_type: l1

# 공개 스펙 기준(시연 200개, 10fps)으로 조립처럼 긴 호흡의 작업에 맞춘 값 — 매 회차 과제가
# 바뀌면 재튜닝이 필요한 숫자라 프리셋에 명시적으로 박아둔다.
chunk_size: 20
n_action_steps: 5  # chunk_size보다 짧게 둬서 매 5스텝마다 재계획(replan) — 폐루프 피드백 반영 빈도

# LeHome 우승 보고서(arXiv 2606.27163)식 "먼 미래일수록 분산이 커진다"는 가정을 켠다 —
# a/s는 아직 실제 데이터로 피팅 못해 항등값(위 상단 주석 참고).
per_timestep_norm: true
per_timestep_norm_a: 1.0
per_timestep_norm_s: 0.0

# 비전 인코더는 고정(이미 SmolVLAConfig 기본값과 동일 — 명시적으로 박아서 프리셋만 봐도
# 학습 범위가 드러나게 함), 액션 expert 전체 학습 + VLM은 LoRA(PEFT 설정은 프리셋 바깥,
# 학습 스크립트의 --use-peft 등으로 켠다 — _get_default_peft_targets()가 이미 VLM
# q/v_proj + 공용 projection들을 타겟으로 잡는다).
freeze_vision_encoder: true

# per_timestep_norm과 동시에 켜면 LAC의 rho/omega 임계값이 "스케일된 공간" 기준으로 틀어질
# 수 있어(modeling_smolvla.py의 forward()/​_denoise_loop() 주석 참고), 재캘리브레이션 전까지는
# 꺼둔다 — RoCo 1차 제출 범위에서는 LAC 자체가 필수가 아니다.
lac_mode: none

# quantization: 이 레포 코드베이스에 그런 옵션이 아직 존재하지 않아(grep 결과 0건) 프리셋에서도
# 생략한다 — docs/configurable_ard.md 참고.
